<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ABC 小遊戲</title>
<style>
  :root {
    --ink: #7a5c99; --pink: #ffb3c7; --peach: #ffd0a8; --lemon: #fff1a8; --mint: #b8ecd2; --sky: #aedcf5; --lilac: #d4c1f5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink);
    font-family: "Chalkboard SE", "Comic Sans MS", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: linear-gradient(180deg, #ffd9e8 0%, #e6d9ff 38%, #cdeeff 70%, #d9f7e6 100%); }

  /* 背景裝飾 */
  #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .cloud { position: absolute; width: 120px; height: 38px; background: #fff; border-radius: 40px; opacity: .85; animation: drift 40s linear infinite; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 54px; height: 54px; top: -26px; left: 18px; }
  .cloud::after { width: 40px; height: 40px; top: -18px; left: 62px; }
  .c1 { top: 8%; left: -140px; } .c2 { top: 26%; left: -140px; transform: scale(.7); animation-duration: 55s; animation-delay: -20s; }
  .c3 { top: 58%; left: -140px; transform: scale(.85); animation-duration: 48s; animation-delay: -35s; }
  @keyframes drift { to { left: 110vw; } }
  .deco { position: absolute; font-size: 1.6rem; opacity: .75; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 50% { transform: scale(1.3) rotate(12deg); opacity: .35; } }
  .hill { position: absolute; bottom: -60px; border-radius: 50%; }
  .h1 { left: -20%; width: 85%; height: 190px; background: #c5f0d8; }
  .h2 { right: -25%; width: 90%; height: 160px; background: #ffe3ef; }
  .h3 { left: 20%; width: 70%; height: 130px; background: #d8ccf7; opacity: .8; }

  #app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; gap: 16px; }
  .hidden { display: none !important; }
  h1 { margin: 0; font-size: 2.4rem; text-align: center; color: #fff; letter-spacing: 2px;
    text-shadow: 0 3px 0 #c9a7ee, 0 6px 12px rgba(150,110,200,.35); }
  .big { width: min(80vw, 340px); padding: 20px 12px; font-size: 1.7rem; font-weight: 700; border: 4px solid #fff; border-radius: 32px; color: #fff; font-family: inherit;
    text-shadow: 0 2px 0 rgba(0,0,0,.15); box-shadow: 0 7px 0 rgba(150,110,200,.35), 0 12px 20px rgba(150,110,200,.25); }
  .big:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(150,110,200,.35); }
  .b1 { background: linear-gradient(135deg, #ffa8c5, #ffc9a8); }
  .b2 { background: linear-gradient(135deg, #9ad4f5, #b9a8f5); }
  .groups { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 340px; }
  .groups button { padding: 10px 16px; font-size: 1.1rem; font-family: inherit; border: 3px solid #fff; border-radius: 20px; background: rgba(255,255,255,.6); color: var(--ink); font-weight: 700; box-shadow: 0 3px 0 rgba(150,110,200,.25); }
  .groups button.on { background: var(--lilac); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.15); }
  .home { position: fixed; z-index: 2; top: 12px; left: 12px; font-size: 1.8rem; background: #fff; border: 0; border-radius: 50%; width: 56px; height: 56px; box-shadow: 0 4px 0 rgba(150,110,200,.3); }
  .score { position: fixed; z-index: 2; top: 14px; right: 14px; font-size: 1.5rem; font-weight: 700; background: rgba(255,255,255,.8); padding: 8px 16px; border-radius: 24px; box-shadow: 0 3px 0 rgba(150,110,200,.25); }
  .prompt { font-size: 1.6rem; font-weight: 700; text-align: center; min-height: 2.2em; background: rgba(255,255,255,.65); padding: 10px 20px; border-radius: 24px; }
  .prompt b { color: #f06a9b; font-size: 2.2rem; }
  .replay { font-size: 1.6rem; border: 3px solid #fff; background: var(--lemon); border-radius: 22px; padding: 6px 20px; box-shadow: 0 4px 0 rgba(200,170,60,.35); }
  .field { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 22px; width: min(92vw, 380px); }
  .balloon { position: relative; aspect-ratio: 4/5; border: 0; border-radius: 50% 50% 48% 48%; font-size: 4.2rem; font-weight: 800; font-family: inherit; color: #fff;
    text-shadow: 0 3px 0 rgba(120,80,160,.35); animation: bob 2.4s ease-in-out infinite;
    background-image: radial-gradient(circle at 32% 25%, rgba(255,255,255,.75) 0 10%, transparent 11%), radial-gradient(circle at 35% 30%, rgba(255,255,255,.35), transparent 60%);
    box-shadow: inset -10px -12px 0 rgba(120,80,160,.12), 0 8px 14px rgba(150,110,200,.25); }
  .balloon::after { content: ""; position: absolute; left: 50%; bottom: -26px; width: 2px; height: 26px; background: rgba(122,92,153,.5); }
  .balloon:nth-child(2) { animation-delay: -.6s; } .balloon:nth-child(3) { animation-delay: -1.2s; } .balloon:nth-child(4) { animation-delay: -1.8s; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-12px) rotate(2deg); } }
  .pop { animation: pop .35s forwards; }
  @keyframes pop { to { transform: scale(1.6); opacity: 0; } }
  .shake { animation: shake .4s; }
  @keyframes shake { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .pic { font-size: 8.5rem; line-height: 1; width: 11rem; height: 11rem; display: grid; place-items: center; background: rgba(255,255,255,.7); border-radius: 50%; border: 6px solid #fff; box-shadow: 0 8px 0 rgba(150,110,200,.25); }
  .choices { display: flex; gap: 14px; }
  .choice { width: 26vw; max-width: 110px; aspect-ratio: 1; border: 4px solid #fff; border-radius: 28px; font-size: 3.4rem; font-weight: 800; font-family: inherit; color: #fff;
    text-shadow: 0 3px 0 rgba(120,80,160,.35); box-shadow: 0 6px 0 rgba(150,110,200,.3); }
  .choice:active { transform: translateY(4px); }
  .word { font-size: 1.9rem; font-weight: 800; color: #f06a9b; text-align: center; min-height: 3em; text-shadow: 0 2px 0 #fff; }
  .confetti { position: fixed; z-index: 3; top: -20px; font-size: 2rem; pointer-events: none; animation: fall 1.6s linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
</style>
</head>
<body>
<div id="bg">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <span class="deco" style="top:12%;left:12%">⭐</span><span class="deco" style="top:20%;right:10%;animation-delay:-1s">✨</span>
  <span class="deco" style="top:46%;left:6%;animation-delay:-2s">💖</span><span class="deco" style="top:62%;right:8%;animation-delay:-.5s">⭐</span>
  <span class="deco" style="top:78%;left:18%;animation-delay:-1.5s">✨</span>
  <div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div>
</div>
<div id="app">
  <!-- 首頁 -->
  <section id="menu" style="display:contents">
    <h1>🔤 ABC 小遊戲</h1>
    <button class="big b1" data-mode="balloon">🎈 戳氣球</button>
    <button class="big b2" data-mode="word">🍎 字母和圖片</button>
    <div class="groups" id="groups"></div>
  </section>

  <!-- 遊戲 -->
  <section id="game" class="hidden" style="display:contents">
    <button class="home" id="home">🏠</button>
    <div class="score" id="score">⭐ 0</div>
    <div id="stage" style="display:contents"></div>
  </section>
</div>

<script>
const WORDS = {
  A:['Apple','蘋果','🍎'], B:['Ball','球','⚽'], C:['Cat','貓咪','🐱'], D:['Dog','小狗','🐶'],
  E:['Egg','雞蛋','🥚'], F:['Fish','魚','🐟'], G:['Grapes','葡萄','🍇'], H:['Hat','帽子','🎩'],
  I:['Ice cream','冰淇淋','🍦'], J:['Juice','果汁','🧃'], K:['Kite','風箏','🪁'], L:['Lion','獅子','🦁'],
  M:['Moon','月亮','🌙'], N:['Nose','鼻子','👃'], O:['Orange','柳橙','🍊'], P:['Pig','小豬','🐷'],
  Q:['Queen','皇后','👸'], R:['Rabbit','兔子','🐰'], S:['Sun','太陽','☀️'], T:['Tiger','老虎','🐯'],
  U:['Umbrella','雨傘','☂️'], V:['Violin','小提琴','🎻'], W:['Whale','鯨魚','🐳'], X:['Xylophone','木琴','🎶'],
  Y:['Yo-yo','溜溜球','🪀'], Z:['Zebra','斑馬','🦓']
};
const GROUPS = { 'A-E':'ABCDE', 'F-J':'FGHIJ', 'K-O':'KLMNO', 'P-T':'PQRST', 'U-Z':'UVWXYZ', '全部':'ABCDEFGHIJKLMNOPQRSTUVWXYZ' };
const COLORS = ['#ff9db8','#8fd0f5','#8fe0b4','#ffc46b','#c3a4f2','#ffa98a'];

let pool = GROUPS['A-E'], score = 0, mode = null, target = null, busy = false;
const $ = s => document.querySelector(s);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);

// ---- 語音 ----
function say(parts) { // parts: [[文字, 語言], ...]
  if (!('speechSynthesis' in window)) return Promise.resolve();
  speechSynthesis.cancel();
  return Promise.all(parts.map(([t, l]) => new Promise(res => {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = l; u.rate = 0.85; u.pitch = 1.2;
    u.onend = u.onerror = res;
    speechSynthesis.speak(u);
  })));
}
const sayEn = t => say([[t, 'en-US']]);

// ---- 音效/彩紙 ----
let ac;
function beep(freqs) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = f; o.type = 'triangle';
      g.gain.setValueAtTime(.25, ac.currentTime + i * .12);
      g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + i * .12 + .2);
      o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime + i * .12); o.stop(ac.currentTime + i * .12 + .22);
    });
  } catch (e) {}
}
function confetti() {
  for (let i = 0; i < 18; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = pick(['🎉','⭐','✨','🎈','💖']);
    c.style.left = Math.random() * 95 + 'vw';
    c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2200);
  }
}
function win() { score++; $('#score').textContent = '⭐ ' + score; beep([523, 659, 784]); confetti(); }
function wrong(el) { beep([200]); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

// ---- 首頁 ----
function buildMenu() {
  const g = $('#groups');
  Object.keys(GROUPS).forEach(k => {
    const b = document.createElement('button');
    b.textContent = k; b.className = GROUPS[k] === pool ? 'on' : '';
    b.onclick = () => { pool = GROUPS[k]; [...g.children].forEach(x => x.classList.toggle('on', x === b)); };
    g.appendChild(b);
  });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => start(b.dataset.mode));
  $('#home').onclick = () => { speechSynthesis.cancel(); show(false); };
}
function show(inGame) {
  $('#menu').classList.toggle('hidden', inGame);
  $('#game').classList.toggle('hidden', !inGame);
}
function start(m) { mode = m; score = 0; $('#score').textContent = '⭐ 0'; show(true); next(); }
function next() { busy = false; (mode === 'balloon' ? balloonRound : wordRound)(); }

function pickTarget(n) { // 回傳目標與干擾字母
  const t = pick([...pool].filter(c => c !== target));
  const others = shuffle([...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].filter(c => c !== t)).slice(0, n - 1);
  return [t, shuffle([t, ...others])];
}

// ---- 遊戲一：戳氣球 ----
function balloonRound() {
  const [t, letters] = pickTarget(4);
  target = t;
  const stage = $('#stage');
  stage.innerHTML = `<div class="prompt" id="p">找找看 <b>${t}</b> 在哪裡？</div>
    <button class="replay" id="again">🔊</button><div class="field" id="field"></div>`;
  letters.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'balloon'; b.textContent = c; b.style.background = COLORS[i % COLORS.length];
    b.onclick = () => {
      if (busy) return;
      if (c === target) {
        busy = true; b.classList.add('pop'); win();
        say([['Great job!', 'en-US'], ['你好棒！', 'zh-TW']]).then(() => setTimeout(next, 300));
      } else { wrong(b); sayEn(c).then(() => say([['再找找看喔', 'zh-TW']])); }
    };
    $('#field').appendChild(b);
  });
  const ask = () => say([['Find the letter ' + t, 'en-US'], ['找找看哪一個是 ' + t, 'zh-TW']]);
  $('#again').onclick = ask; ask();
}

// ---- 遊戲二：字母和圖片 ----
function wordRound() {
  const [t, letters] = pickTarget(3);
  target = t;
  const [en, zh, emoji] = WORDS[t];
  const stage = $('#stage');
  stage.innerHTML = `<div class="pic">${emoji}</div>
    <div class="prompt">${zh}（${en}）<br>是哪個字母開頭？</div>
    <button class="replay" id="again">🔊</button>
    <div class="choices" id="choices"></div><div class="word" id="word"></div>`;
  letters.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = c; b.style.background = COLORS[i % COLORS.length];
    b.onclick = () => {
      if (busy) return;
      if (c === target) {
        busy = true; win();
        $('#word').innerHTML = `${t} is for ${en}!<br>${zh}`;
        say([[`${t}, ${t}, ${en}!`, 'en-US']]).then(() => say([[zh, 'zh-TW']])).then(() => setTimeout(next, 600));
      } else { wrong(b); say([['再試試看喔', 'zh-TW']]); }
    };
    $('#choices').appendChild(b);
  });
  const ask = () => say([[en, 'en-US'], [zh + '，是哪個字母開頭呢？', 'zh-TW']]);
  $('#again').onclick = ask; ask();
}

buildMenu();
</script>
</body>
</html>
